<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Delivery Coverage</title>
  <script>
    try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d4ed8'/%3E%3Cpath d='M16 26s-7-6.2-7-11.2a7 7 0 0 1 14 0C23 19.8 16 26 16 26z' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
  <style>
    /* hosted, read-only layout: a top bar instead of the admin sidebar */
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar .theme-btn { width: auto; }
    .ro-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
      border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px; }
    .wrap { margin: 0 auto; }
    .load-error { padding: 48px 24px; text-align: center; }
    @media (max-width: 860px) { .topbar { padding: 10px 16px; } .ro-badge { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <span class="brand-mark"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-6-5.3-6-9.6a6 6 0 0 1 12 0c0 4.3-6 9.6-6 9.6z"/><path d="m9.6 10.8 1.7 1.7 3.2-3.4"/></svg></span>
      <span class="brand-text"><b>Delivery Coverage</b><small>Parxen · Flipkart</small></span>
    </span>
    <span style="display:flex;align-items:center;gap:10px">
      <span class="ro-badge">View only</span>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="Switch colour theme">
        <span class="t-light"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg> Dark mode</span>
        <span class="t-dark"><svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg> Day mode</span>
      </button>
    </span>
  </header>
  <main class="main wrap" id="app">
    <p class="muted" style="padding:40px 0">Loading the latest results…</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
